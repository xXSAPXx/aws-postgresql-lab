---
- name: List the services PMM monitors
  ansible.builtin.uri:
    url: "{{ labapp_pmm_url }}/v1/inventory/services"
    user: "{{ labapp_pmm_user }}"
    password: "{{ labapp_pmm_password }}"
    force_basic_auth: true
    validate_certs: false
  register: labapp_pmm_services

# pmm-admin inside the PMM container; PMM then collects the probe's metrics itself.
- name: Let PMM collect the probe metrics
  ansible.builtin.command: >-
    docker exec {{ labapp_pmm_container }} pmm-admin add external-serverless
    --server-url=https://{{ labapp_pmm_user }}:{{ labapp_pmm_password }}@127.0.0.1:8443/
    --server-insecure-tls
    --url=http://{{ labapp_metrics_host }}:{{ labapp_metrics_port }}/metrics
    --external-name=labapp-probe
  when: "'labapp-probe' not in (labapp_pmm_services.json | string)"
  changed_when: true
  no_log: true

- name: Create the Lab folder in PMM
  ansible.builtin.uri:
    url: "{{ labapp_pmm_url }}/graph/api/folders"
    method: POST
    user: "{{ labapp_pmm_user }}"
    password: "{{ labapp_pmm_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      uid: "{{ labapp_dashboard_folder_uid }}"
      title: "{{ labapp_dashboard_folder_title }}"
    status_code: [200, 409, 412]
  register: labapp_folder
  changed_when: labapp_folder.status == 200

- name: Read the dashboard currently in PMM
  ansible.builtin.uri:
    url: "{{ labapp_pmm_url }}/graph/api/dashboards/uid/labapp-probe"
    user: "{{ labapp_pmm_user }}"
    password: "{{ labapp_pmm_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: labapp_current_dashboard

- name: Upload the dashboard
  ansible.builtin.uri:
    url: "{{ labapp_pmm_url }}/graph/api/dashboards/db"
    method: POST
    user: "{{ labapp_pmm_user }}"
    password: "{{ labapp_pmm_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      dashboard: "{{ lookup('ansible.builtin.file', 'labapp-dashboard.json') | from_json | combine({'description': labapp_dashboard_description}) }}"
      folderUid: "{{ labapp_dashboard_folder_uid }}"
      overwrite: true
      message: Uploaded by Ansible (role labapp)
  when: >-
    labapp_current_dashboard.status == 404
    or labapp_current_dashboard.json.dashboard.description | default('') != labapp_dashboard_description
  changed_when: true
