---
- name: Restart the labapp probe
  ansible.builtin.systemd_service:
    name: labapp-probe
    state: restarted
    daemon_reload: true

- name: Restart the labapp workload
  ansible.builtin.systemd_service:
    name: labapp-workload
    state: restarted
    daemon_reload: true
  when: labapp_workload_enabled
