---
# EBS data volume for a database server: found by its volume ID, formatted once, mounted.
# Run this role before the database is installed, so all its files land on the data volume.
data_volume_id: "" # from the inventory (Terraform), e.g. vol-0123456789abcdef0
data_volume_mount_point: "" # set by the lab, e.g. /var/lib/pgsql
data_volume_fstype: xfs
data_volume_mount_options: defaults,noatime,nofail # nofail: the server still boots if the disk is missing
