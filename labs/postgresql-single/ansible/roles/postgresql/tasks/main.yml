---
##################################################################
# Percona Distribution for PostgreSQL installation:
##################################################################

- name: Disable the distribution's PostgreSQL module (Percona packages are used instead)
  ansible.builtin.command: dnf -y module disable postgresql
  changed_when: false

- name: Enable the Percona Distribution for PostgreSQL repository
  ansible.builtin.command: percona-release setup ppg{{ postgresql_version }}
  args:
    creates: "{{ postgresql_bin_dir }}/postgres"

- name: Install PostgreSQL, pgBackRest, pg_repack and pg_stat_monitor
  ansible.builtin.dnf:
    name: "{{ postgresql_packages }}"
    state: present

- name: Initialize the database cluster
  ansible.builtin.command: "{{ postgresql_bin_dir }}/postgresql-{{ postgresql_version }}-setup initdb"
  args:
    creates: "{{ postgresql_data_dir }}/PG_VERSION"


##################################################################
# Configuration:
##################################################################

- name: Include conf.d from postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgresql_data_dir }}/postgresql.conf"
    regexp: "^#?include_dir ="
    line: "include_dir = 'conf.d'"
  notify: Restart PostgreSQL

- name: Create conf.d
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Write the lab settings
  ansible.builtin.template:
    src: 01-lab.conf.j2
    dest: "{{ postgresql_data_dir }}/conf.d/01-lab.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart PostgreSQL

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload PostgreSQL

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Apply pending restarts before configuring the database
  ansible.builtin.meta: flush_handlers


##################################################################
# Database objects:
##################################################################

- name: Create the pg_stat_monitor extension
  community.postgresql.postgresql_ext:
    name: pg_stat_monitor
    login_db: postgres
  become: true
  become_user: postgres

- name: Create the PMM monitoring user
  community.postgresql.postgresql_user:
    name: "{{ postgresql_monitoring_user }}"
    password: "{{ postgresql_monitoring_password }}"
    role_attr_flags: LOGIN,SUPERUSER
    login_db: postgres
  become: true
  become_user: postgres
  no_log: true


##################################################################
# OS:
##################################################################

- name: Let the postgres OS user use sudo (lab convenience)
  ansible.builtin.copy:
    content: "postgres ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/postgres
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  when: postgresql_os_user_sudo
